    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Applies the saved theme before first paint, so a user who chose light
      on a dark-mode OS never sees a flash of the wrong colours.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* storage blocked (private window): fall back to prefers-color-scheme */
        }
      })();
    </script>
